name: C++17 CI (Build & ASan Tests)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake (with ASan/UBSan)
        run: cmake -B build -DENABLE_ASAN=ON
      - name: Build
        run: cmake --build build
      - name: Run Unit Tests
        run: ctest --test-dir build --output-on-failure
