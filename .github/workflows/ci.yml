name: C++17 CI (ASan & TSan)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  asan-ubsan:
    name: Build & Test (ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake (ASan/UBSan)
        run: cmake -B build-asan -DENABLE_ASAN=ON
      - name: Build
        run: cmake --build build-asan
      - name: Run Unit Tests
        run: ctest --test-dir build-asan --output-on-failure

  tsan:
    name: Build & Test (ThreadSanitizer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake (TSan)
        run: cmake -B build-tsan -DENABLE_TSAN=ON
      - name: Build
        run: cmake --build build-tsan
      - name: Run Unit Tests
        run: ctest --test-dir build-tsan --output-on-failure